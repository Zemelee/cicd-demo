name: Deploy to Server (SFTP Method)

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: test/package-lock.json

      - name: Install dependencies
        run: |
          cd test
          npm install

      - name: Build project
        run: |
          cd test
          npm run build

      - name: Deploy via SSH/SFTP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "test/dist/*"
          target: "/var/www/sugarblack/dist"

      - name: SSH and restart service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "Deploying to sugarblack.top:83..."
            
            # 设置正确的权限
            sudo chown -R www-data:www-data /var/www/sugarblack
            
            # 如果使用了 PM2 或其他进程管理器，可以重启服务
            # sudo pm2 restart app
            
            echo "Deployment completed!"
